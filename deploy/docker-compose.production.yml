services:
  bloomtype:
    image: ghcr.io/camster91/magic-type-quest:main
    container_name: bloomtype
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    ports:
      - "127.0.0.1:3055:80"
