server {
    listen 80;
    server_name localhost;
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;

    location = / {
        return 302 /magic-type-quest/;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store";
        return 200 "ok\n";
    }

    # The app shell and update metadata must revalidate so a release can replace
    # an installed PWA without waiting for a long browser cache lifetime.
    location ~ ^/magic-type-quest/(index|landing|parents|teacher)\.html$ {
        rewrite ^/magic-type-quest/(.*)$ /$1 break;
        try_files $uri =404;
        expires -1;
    }

    location ~ ^/magic-type-quest/(manifest\.json|sw\.js)$ {
        rewrite ^/magic-type-quest/(.*)$ /$1 break;
        try_files $uri =404;
        expires -1;
    }

    # Vite fingerprints generated JavaScript and CSS, making these files safe
    # to cache immutably. Public art uses stable names and must revalidate.
    location ~ "^/magic-type-quest/(assets/.*-[A-Za-z0-9_-]{8,}\.(js|css))$" {
        try_files /$1 =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /magic-type-quest/ {
        try_files /index.html =404;
        expires -1;
    }

    location /magic-type-quest/ {
        rewrite ^/magic-type-quest/(.*)$ /$1 break;
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }
}
