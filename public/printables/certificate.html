<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BloomType — Typing certificate</title>
  <link rel="icon" href="data:,">
  <meta name="description" content="A printable BloomType typing certificate for Typing Week or finishing a level.">
  <style>
    :root { --ink: #1E1B4B; --violet: #6D28D9; --gold: #B45309; --line: #A78BFA; --paper: #FFFFFF; }
    @page { size: landscape; margin: 12mm; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: Georgia, 'Times New Roman', serif; }
    .cert { box-sizing: border-box; max-width: 1000px; margin: 24px auto; padding: 48px 56px; border: 10px double var(--line); text-align: center; }
    h1 { font-size: 2.6rem; margin: 0 0 8px; color: var(--violet); }
    .flowers { font-size: 2rem; letter-spacing: 6px; }
    .lead { font-size: 1.2rem; margin: 18px 0 6px; }
    .name { display: block; margin: 18px auto; width: 70%; border-bottom: 2px solid var(--ink); height: 2.6rem; }
    .what { font-size: 1.3rem; margin: 10px 0 28px; }
    .row { display: flex; justify-content: space-between; gap: 32px; margin-top: 36px; }
    .row div { flex: 1; border-top: 1px solid var(--ink); padding-top: 6px; font-size: 0.95rem; }
    .hint { font-family: Arial, sans-serif; font-size: 0.9rem; text-align: center; color: var(--gold); }
    @media print { .hint { display: none; } .cert { margin: 0 auto; } }
  </style>
</head>
<body>
  <p class="hint" data-t="hint">Print this page (Ctrl+P or ⌘P). Write the student's name by hand.</p>
  <main class="cert">
    <div class="flowers" aria-hidden="true">🌸 🌼 🌻 🌷 🌺</div>
    <h1 data-t="h1">Typing Certificate</h1>
    <p class="lead" data-t="lead">This certificate is proudly given to</p>
    <span class="name" aria-label="Student name"></span>
    <p class="what" data-t="what">for growing a meadow full of flowers with careful, steady typing in BloomType.</p>
    <div class="row">
      <div data-t="date">Date</div>
      <div data-t="level">Level reached</div>
      <div data-t="adult">Teacher or parent</div>
    </div>
  </main>

  <script>
    var TEXT = {
      fr: {
        title: 'BloomType — Certificat de dactylographie',
        hint: 'Imprimez cette page (Ctrl+P ou ⌘P). Écrivez le nom de l’élève à la main.',
        h1: 'Certificat de dactylographie',
        lead: 'Ce certificat est fièrement remis à',
        what: 'pour avoir fait pousser une prairie pleine de fleurs en tapant avec soin et régularité dans BloomType.',
        date: 'Date', level: 'Niveau atteint', adult: 'Enseignant ou parent'
      },
      es: {
        title: 'BloomType — Certificado de mecanografía',
        hint: 'Imprime esta página (Ctrl+P o ⌘P). Escribe el nombre del estudiante a mano.',
        h1: 'Certificado de mecanografía',
        lead: 'Este certificado se entrega con orgullo a',
        what: 'por hacer crecer una pradera llena de flores escribiendo con cuidado y constancia en BloomType.',
        date: 'Fecha', level: 'Nivel alcanzado', adult: 'Docente o familia'
      }
    };
  </script>
  <script>
    // Same choice as the teacher page: ?lang=, then the saved profile, then the browser.
    (function () {
      var supported = ['en', 'fr', 'es'];
      var lang = new URLSearchParams(location.search).get('lang');
      if (supported.indexOf(lang) < 0) {
        try { lang = (JSON.parse(localStorage.getItem('bloomtype-profile') || 'null') || {}).locale; } catch (e) { lang = null; }
      }
      if (supported.indexOf(lang) < 0) lang = (navigator.language || 'en').split('-')[0];
      if (supported.indexOf(lang) < 0 || lang === 'en') return;
      var t = TEXT[lang];
      document.documentElement.lang = lang;
      document.title = t.title;
      document.querySelectorAll('[data-t]').forEach(function (el) {
        var value = t[el.getAttribute('data-t')];
        if (value) el.innerHTML = value;
      });
    })();
  </script>
</body>
</html>
