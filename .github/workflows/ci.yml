name: CI

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  # No path filter on pull requests: branch protection requires the `ci`
  # check, so a docs-only PR would otherwise wait for it forever.
  pull_request:
    branches: [main]

jobs:
  ci:
    # Pull requests run on GitHub-hosted runners (free for this public repo),
    # so code from a pull request never runs on the privileged Ashbi VPS.
    # Only pushes to main, which a maintainer has merged, use the VPS runner.
    # A fork can still edit this file in its own pull request, so the
    # repository must also require approval before outside contributors'
    # workflows run (see docs/ASHBI-CI.md).
    runs-on: ${{ github.event_name == 'push' && fromJSON('["self-hosted","Linux","X64","ashbi-vps","magic-type-quest"]') || 'ubuntu-latest' }}
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      # The VPS runner's service user owns the workspace; hosted runners use the image default.
      options: ${{ github.event_name == 'push' && '--user 986:986' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Keep test tooling on the supported LTS runtime independently of the browser image.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run test:v2-theme
      - run: npm run check:v2-theme
      - run: npm run test:v2-assets
      - run: npm run check:v2-assets
      - run: npm test -- --run
      - run: npm run build
      - run: npm run verify:local-only-build
      - name: End-to-end tests
        if: github.actor != 'dependabot[bot]'
        run: npm run test:e2e
      - run: npm audit --audit-level=high
